name: Android build
on:
  push:
    paths: ['android/**', 'progress/**', 'scripts/**', 'tests/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'progress/**', 'scripts/**', 'tests/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: progress/package-lock.json
      - name: Build and verify progress dashboard
        working-directory: progress
        run: |
          npm ci
          npm run build
          node test-model.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify gesture routing
        run: |
          mkdir -p /tmp/king-tests
          javac -d /tmp/king-tests android/app/src/main/java/com/artist/king/GestureRoutes.java tests/GestureRoutesTest.java
          java -cp /tmp/king-tests com.artist.king.GestureRoutesTest
      - name: Compile and lint
        working-directory: android
        run: gradle assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KING-Focus-development-build
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: android/app/build/reports/lint-results-debug.html
